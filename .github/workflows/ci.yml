# Runs static checks on every PR and push to main, then gates releases with a
# dependent production build and browser smoke test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on PR pushes; always let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # pnpm and node versions come from packageManager and engines.node in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      # Run the remaining checks even when an earlier one fails, so one push
      # surfaces every failure instead of one per CI cycle.
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}

  release-smoke:
    needs: checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        # MongoDB 8 refuses to start on runner kernels 6.19+ (SERVER-121912). Letting glibc
        # own rseq makes tcmalloc fall back to per-thread caches, which avoids the crash.
        # Remove once runners and the image both carry the fix (8.0.30+ on kernel 7.0.14+).
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: mongodb://127.0.0.1:27017/lolev-beer-ci
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_only
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ci-public-placeholder
      E2E_DISPOSABLE_DATABASE: '1'
      E2E_ADMIN_EMAIL: release-smoke@example.test
      E2E_ADMIN_PASSWORD: ci-only-release-smoke-password
      VERCEL_ENV: preview
      PAYLOAD_DROP_DATABASE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
