# Runs static checks on every PR and push to main, then gates releases with a
# dependent production build and browser smoke test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on PR pushes; always let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm and node versions come from packageManager and engines.node in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      # Run the remaining checks even when an earlier one fails, so one push
      # surfaces every failure instead of one per CI cycle.
      - run: pnpm lint
        if: ${{ !cancelled() }}
      - run: pnpm test
        if: ${{ !cancelled() }}

  release-smoke:
    needs: checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: mongodb://127.0.0.1:27017/lolev-beer-ci
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_ci_only
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ci-public-placeholder
      E2E_DISPOSABLE_DATABASE: "1"
      E2E_ADMIN_EMAIL: release-smoke@example.test
      E2E_ADMIN_PASSWORD: ci-only-release-smoke-password
      VERCEL_ENV: preview
      PAYLOAD_DROP_DATABASE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:install
      - run: pnpm e2e:seed
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
