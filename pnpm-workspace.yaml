# pnpm 10+ no longer reads the `pnpm` field from package.json; these settings
# live here instead. The overrides are security floors keeping transitive
# dependencies above known-vulnerable versions, so losing them silently
# reopens Dependabot alerts — keep them here, not in package.json.
# pnpm 11 runs install scripts only for packages listed true here
# (it replaced pnpm 10's onlyBuiltDependencies).
allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
  '@sentry/cli': false

overrides:
  'undici@5': '^6.28.1'
  'undici@6': '^6.28.1'
  'undici@7': '^7.29.1'
  'undici@8': '>=8.10.2'
  'http-cache-semantics': '>=4.3.0'
  'ajv@8': '>=8.18.0'
  '@opentelemetry/core': '>=2.8.0'
  'dompurify': '>=3.4.16'
  'esbuild': '>=0.28.1'
  'file-type': '>=21.3.1'
  'postcss': '>=8.5.23'
  'uuid': '>=11.1.1'
  'js-yaml@5': '>=5.2.2'
  'brace-expansion@1': '>=1.1.18 <2'
  'brace-expansion@5': '>=5.0.12'
  'fast-uri': '>=4.1.5'
  'nanoid@3': '>=3.3.18'
  'svgo@3': '>=3.3.4'
  'js-yaml@4': '>=4.2.0'
  'sharp': '0.35.4'

patchedDependencies:
  ably@2.29.0: patches/ably@2.29.0.patch
