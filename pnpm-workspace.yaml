# pnpm 10 no longer reads the `pnpm` field from package.json; these settings
# live here instead. The overrides are security floors keeping transitive
# dependencies above known-vulnerable versions, so losing them silently
# reopens Dependabot alerts — keep them here, not in package.json.
onlyBuiltDependencies:
  - "sharp"
  - "esbuild"
  - "unrs-resolver"

overrides:
  "next": "15.5.23"
  "undici@5": "^6.28.0"
  "undici@6": "^6.28.0"
  "undici@7": "^7.29.0"
  "ajv@8": ">=8.18.0"
  "@opentelemetry/core": ">=2.8.0"
  "dompurify": ">=3.4.13"
  "esbuild": ">=0.28.1"
  "file-type": ">=21.3.1"
  "mongoose": ">=8.22.1 <9.0.0"
  "postcss": ">=8.5.23"
  "uuid": ">=11.1.1"
  "js-yaml@5": ">=5.2.2"
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@5": ">=5.0.9"
  "fast-uri": ">=3.1.5"
  "nanoid@3": ">=3.3.18"
  "svgo@3": ">=3.3.4"
  "js-yaml@4": ">=4.2.0"
  "sharp": "0.35.3"

patchedDependencies:
  "next@15.5.23": "patches/next@15.5.23.patch"
